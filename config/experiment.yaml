# Active SUTD v4. Provisional labels; related images grouped before 70/10/20 re-split.
project:
  name: aircraft-data-efficiency
  version: 0.1.0
task:
  type: detection
  classes: &id001
  - missing-rivet
  - rust
  - scratch
  core_classes: *id001
  safety_critical_classes:
  - missing-rivet
  - rust
seeds:
- 0
- 1
- 2
datasets:
  primary: sutd_v4
  experiment_sources:
  - sutd_v4
  pool_supplementary: false
  unmapped_class_policy: exclude_images
  annotation_policy:
    require_domain_and_completeness_review: false
    empty_labels: quarantine_until_verified
    review_ledger: docs/sutd_visual_review.json
  source_ids:
    SUTD4: sutd_v4
  sources:
    sutd_v4:
      path: data/raw/aircraft_AI1.v4-983-images-70-20-10-ratio-without-augmentation.coco
      annotation: coco_boxes
      version: 4
      license: CC BY 4.0 (export metadata)
      provenance: https://universe.roboflow.com/sutd-4mhea/aircraft_ai1; exported
        2024-04-06; 640x640 stretch; no export augmentation
      n_images: 983
      class_map:
        missing-rivet: missing-rivet
        rust: rust
        scractch: scratch
        rust-scracth-missingrivet: UNMAPPED
split:
  train_pool: 0.7
  val: 0.1
  test: 0.2
  split_seed: 1234
  stratify_by_source: false
dedup:
  method: phash
  hamming_threshold: 5
training:
  model: yolov8n.pt
  data: data/processed/sutd_v4/dataset/data.yaml
  project: results/detection
  name: sutd_v4_baseline
  image_size: 640
  resize_policy: aspect_preserving_letterbox
  epochs: 30
  batch_size: 8
  patience: 10
  workers: 0
  optimizer: AdamW
  learning_rate: 0.001
  device: auto
  augmentation:
    hsv_h: 0.0
    hsv_s: 0.0
    hsv_v: 0.0
    degrees: 0.0
    translate: 0.0
    scale: 0.0
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.0
    mosaic: 0.0
    mixup: 0.0
    cutmix: 0.0
    copy_paste: 0.0
    multi_scale: 0.0
metrics:
  primary_detection: map50
  detection:
  - map50
  - map50_95
  - per_class_ap
  safety_recall:
    classes:
    - missing-rivet
    - rust
    iou_threshold: 0.5
    confidence_threshold: 0.25
    also_report_precision_at_that_point: true
  cost:
  - train_time_sec
  - inference_ms_per_image
  - n_parameters
compute:
  deterministic: true
