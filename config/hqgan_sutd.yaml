# Bounded SUTD exploratory run; reduced model, not a paper reproduction.
resolution: 64
latent_dim: 128
width: 0.25
hsc_alpha: 1.0
hsc_magnitude: true
batch_size: 8
learning_rate: 0.0002
adam_betas:
- 0.5
- 0.999
generator_objective: non_saturating
seed: 0
cpu_threads: 2
checkpoint_every: 500
ahd:
  beta_start: 0.0001
  beta_end: 0.01
  max_steps: 500
  initial_steps: 1.0
  target: 0.6
  gain: 1.0
  interval: 4
